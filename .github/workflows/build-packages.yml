name: Build Packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  # ============================================================
  # Ubuntu 22.04 LTS — 仅核心功能（无语音，onnxruntime 不可用）
  # ============================================================
  build-deb-jammy:
    name: "DEB · Ubuntu 22.04 (no voice)"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debhelper devscripts equivs \
            autoconf automake libtool pkg-config gnome-common gettext \
            python3 python3-gi \
            autoconf-archive \
            libglib2.0-dev libgtk-3-dev \
            libibus-1.0-dev libpinyin-dev libsqlite3-dev \
            liblua5.3-dev lua5.3 \
            libnotify-dev libjson-glib-dev libsoup-3.0-dev \
            libopencc-dev uuid-dev

      - name: Build .deb (without voice)
        run: |
          ./autogen.sh NOCONFIGURE=1
          VERSION=$(grep 'ibus_major_version\|ibus_minor_version\|ibus_micro_version' configure.ac \
            | grep -oP '\[\K[0-9]+' | tr '\n' '.' | sed 's/\.$//')
          cat > debian/changelog << EOF
          ibus-libpinyin ($VERSION-1) unstable; urgency=medium

            * Automated build for Ubuntu 22.04 LTS (without voice input).

           -- Felix Yin <ybkk1027@gmail.com>  $(date -R)
          EOF
          dpkg-buildpackage -b -uc -us

      - uses: actions/upload-artifact@v4
        with:
          name: deb-ubuntu-22.04
          path: "../*.deb"

  # ============================================================
  # Ubuntu 24.04 LTS — 完整功能（含语音）
  # ============================================================
  build-deb-noble:
    name: "DEB · Ubuntu 24.04 (with voice)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debhelper devscripts equivs \
            autoconf automake libtool pkg-config gnome-common gettext \
            python3 python3-gi \
            autoconf-archive \
            libglib2.0-dev libgtk-3-dev \
            libibus-1.0-dev libpinyin15-dev libsqlite3-dev \
            liblua5.4-dev lua5.4 \
            libnotify-dev libjson-glib-dev libsoup-3.0-dev \
            libopencc-dev uuid-dev \
            libonnxruntime-dev libpulse-dev

      - name: Build .deb (with voice)
        run: |
          ./autogen.sh NOCONFIGURE=1
          VERSION=$(grep 'ibus_major_version\|ibus_minor_version\|ibus_micro_version' configure.ac \
            | grep -oP '\[\K[0-9]+' | tr '\n' '.' | sed 's/\.$//')
          cat > debian/changelog << EOF
          ibus-libpinyin ($VERSION-1) unstable; urgency=medium

            * Automated build for Ubuntu 24.04 LTS (with voice input).

           -- Felix Yin <ybkk1027@gmail.com>  $(date -R)
          EOF
          dpkg-buildpackage -b -uc -us

      - uses: actions/upload-artifact@v4
        with:
          name: deb-ubuntu-24.04
          path: "../*.deb"

  # ============================================================
  # Fedora rawhide — 完整功能（含语音）
  # ============================================================
  build-rpm:
    name: "RPM · Fedora (with voice)"
    runs-on: ubuntu-latest
    container:
      image: fedora:rawhide
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo dnf install -y \
            gettext python3-gobject gcc-c++ gettext-devel libtool \
            pkgconfig sqlite-devel libuuid-devel \
            lua-devel python3-devel \
            json-glib-devel libsoup3-devel \
            autoconf-archive desktop-file-utils ibus-devel libpinyin-devel libnotify-devel \
            make gnome-common which awk rpm-build \
            onnxruntime-devel pulseaudio-libs-devel

      - name: Build RPM
        run: |
          ./autogen.sh
          ./configure \
            --enable-cloud-input-mode \
            --enable-onnxruntime \
            --enable-opencc \
            --enable-libnotify
          make dist
          rpmbuild -bb \
            --define "_sourcedir $(pwd)" \
            --define "_builddir $(pwd)/rpm-build" \
            --define "_srcrpmdir $(pwd)/rpm-build" \
            --define "_rpmdir $(pwd)/rpm-build" \
            --define "_specdir $(pwd)" \
            ibus-libpinyin.spec

      - uses: actions/upload-artifact@v4
        with:
          name: rpm-fedora
          path: "rpm-build/**/*.rpm"

  # ============================================================
  # 发布 — tag 推送时自动创建 GitHub Release
  # ============================================================
  release:
    name: Create GitHub Release
    needs: [build-deb-jammy, build-deb-noble, build-rpm]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate source tarball
        run: |
          ./autogen.sh NOCONFIGURE=1
          ./configure
          make dist

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ibus-libpinyin-*.tar.gz
            artifacts/**/*.deb
            artifacts/**/*.rpm
